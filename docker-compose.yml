version: '3.9'

services:
  # PostgreSQL - Single instance with multiple databases
  postgres:
    image: postgis/postgis:16-master
    platform: linux/amd64
    container_name: postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_MULTIPLE_DATABASES: adonis_db,payload_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas-network

  # Redis - Shared cache for all services
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas-network

  # Payload Studio
  payload:
    build:
      context: .
      dockerfile: ./apps/studio/Dockerfile
    container_name: payload
    restart: unless-stopped
    ports:
      - '${PAYLOAD_PORT:-3002}:3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_DATABASE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payload_db
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:3002}
    volumes:
      # Mount entire monorepo to preserve workspace structure
      - .:/app
      # Preserve node_modules at root level (workspace hoisting)
      - /app/node_modules
      # Preserve studio-specific node_modules
      - /app/apps/studio/node_modules
      # Payload media uploads
      - payload_uploads:/app/apps/studio/media
    working_dir: /app/apps/studio
    networks:
      - saas-network
    command: pnpm dev

  # AdonisJS Backend - API Gateway
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-3333}:3333'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      payload:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3333
      HOST: 0.0.0.0
      APP_KEY: ${APP_KEY}
      SESSION_DRIVER: redis

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_DATABASE: adonis_db

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Payload CMS
      PAYLOAD_URL: http://payload:3002
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_DATABASE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payload_db
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:3002}

      # Payment Providers
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      # Mount entire monorepo to preserve workspace structure
      - .:/app
      # Preserve node_modules at root level (workspace hoisting)
      - /app/node_modules
      # Preserve backend-specific node_modules
      - /app/apps/backend/node_modules
    working_dir: /app/apps/backend
    networks:
      - saas-network
    command: pnpm dev

  # Nuxt Frontend
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost:3333}
    volumes:
      # Mount entire monorepo to preserve workspace structure
      - .:/app
      # Preserve node_modules at root level (workspace hoisting)
      - /app/node_modules
      # Preserve web-specific node_modules
      - /app/apps/web/node_modules
      # Preserve Nuxt build artifacts
      - /app/apps/web/.nuxt
    working_dir: /app/apps/web
    networks:
      - saas-network
    command: pnpm dev

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: saas-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - backend
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - saas-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  payload_uploads:
    driver: local

networks:
  saas-network:
    driver: bridge
